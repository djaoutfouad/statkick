<!doctype html>
<html lang="en">
  <head>
    <!-- Preview environment runtime compatibility: ensure window.fetch is writable to support iframe proxy layers -->
    <script>
      (function() {
        try {
          if (typeof Object !== 'undefined' && Object.prototype && Object.prototype.hasOwnProperty('fetch')) {
            delete Object.prototype.fetch;
          }
          if (typeof EventTarget !== 'undefined' && EventTarget.prototype && EventTarget.prototype.hasOwnProperty('fetch')) {
            delete EventTarget.prototype.fetch;
          }
        } catch (e) {}

        try {
          var _rawFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _rawFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch || _rawFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts & Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-gray-900 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
