<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <!-- Dynamic 3D Green Swoosh Gradient -->
    <linearGradient id="sk-full-swoosh" x1="10%" y1="85%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="30%" stop-color="#16a34a" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- 3D Spherical Shading for Ball -->
    <radialGradient id="sk-full-ball" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Dark Pentagon Facets Gradient -->
    <linearGradient id="sk-full-dark" x1="25%" y1="20%" x2="75%" y2="80%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Inner Spherical Ball Clip -->
    <clipPath id="sk-full-clip">
      <circle cx="42" cy="40" r="25" />
    </clipPath>

    <!-- Drop Shadow for Swoosh -->
    <filter id="sk-full-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#15803d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g id="sk-emblem">
    <!-- Ambient Ground Shadow -->
    <ellipse cx="42" cy="72" rx="21" ry="4.5" fill="#0f172a" fill-opacity="0.12" />

    <!-- Ball Base Sphere -->
    <circle cx="42" cy="40" r="25" fill="url(#sk-full-ball)" stroke="#cbd5e1" stroke-width="0.75" />

    <!-- Clipped Football Panels & Seams -->
    <g clip-path="url(#sk-full-clip)">
      <!-- Central Tilted Pentagon -->
      <polygon points="42,29 50,35 46,45 37,45 33,35" fill="url(#sk-full-dark)" />

      <!-- Radiating Seam Stitch Lines -->
      <path d="M42,29 L42,18 M50,35 L62,29 M46,45 L56,56 M37,45 L27,56 M33,35 L21,29" 
            stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Surrounding Perimeter Patches -->
      <polygon points="36,16 48,16 52,6 32,6" fill="url(#sk-full-dark)" />
      <polygon points="62,29 68,39 77,35 73,22 63,19" fill="url(#sk-full-dark)" />
      <polygon points="56,56 51,66 61,72 68,62 64,52" fill="url(#sk-full-dark)" />
      <polygon points="27,56 32,66 22,72 15,62 19,52" fill="url(#sk-full-dark)" />
      <polygon points="21,29 15,39 6,35 10,22 20,19" fill="url(#sk-full-dark)" />

      <!-- Spherical Ambient Highlight -->
      <ellipse cx="35" cy="28" rx="12" ry="8" transform="rotate(-25 35 28)" fill="#ffffff" fill-opacity="0.32" />
    </g>

    <!-- Dynamic 3D Green Swoosh ribbon wrapping around ball -->
    <path d="M 17,38 C 13,51 17,65 29,71 C 41,78 57,76 67,67 C 74,60 76,49 74,39 C 73,35 69,32 67,34 C 65,36 66,40 66,45 C 65,55 58,64 49,67 C 39,71 27,67 23,59 C 19,52 20,43 24,36 C 25,33 21,32 19,34 Z"
          fill="url(#sk-full-swoosh)" filter="url(#sk-full-shadow)" />

    <!-- Swoosh Highlight Ridge -->
    <path d="M 19,40 C 15,51 19,63 30,69 C 41,75 56,74 65,66 C 71,59 73,50 72,41"
          stroke="#86efac" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Speed Accent -->
    <path d="M 66,32 C 73,39 76,49 74,60 C 73,65 69,70 64,74" 
          stroke="url(#sk-full-swoosh)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45" />
  </g>

  <!-- StatKick Typography -->
  <g id="sk-typography" transform="translate(86, 52)">
    <text font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.035em">
      <tspan fill="#0f172a">Stat</tspan>
      <tspan fill="#16a34a">Kick</tspan>
    </text>
  </g>
</svg>
